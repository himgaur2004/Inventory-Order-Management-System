name: CI — Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  backend-test:
    name: Backend — Python Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        # Tests use SQLite in-memory via conftest.py — no real DB required in CI.
        # config.py reads POSTGRES_* vars at import time, so we must provide dummy
        # values to prevent a validation error even though they are never used.
        env:
          PYTHONPATH: .
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: ci_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend — Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://placeholder.example.com
        run: npm run build
